# Cascade CI: test the Go server and typecheck and test the web UI quickly,
# then build the real image (which compiles rtorrent from source) and probe
# the running API.
#
# The compat job builds the oldest and a mid-series rtorrent on demand — the
# backend genuinely differs between 0.9.x and 0.16.x, and the capability probe
# is what keeps one UI working across them.
#
# Pushes to main skip the smoke job: release.yml builds those commits for both
# architectures and runs the same probes against each before it publishes
# anything, so repeating an amd64-only build here would be pure duplication.
#
# Every probe of a running image is docker/api-smoke.py, the same script
# `make smoke` and the release run, so the three cannot drift apart. The
# toolchain versions are the Dockerfile's ARGs, read from there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full-matrix:
        description: Also build and probe the old rtorrent versions
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request makes the run in flight moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test server + web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain versions
        id: versions
        run: |
          set -eu
          for arg in GO_VERSION NODE_VERSION; do
            value="$(sed -n "s/^ARG $arg=//p" Dockerfile)"
            [ -n "$value" ] || { echo "::error::no ARG $arg in the Dockerfile"; exit 1; }
            echo "$arg=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.versions.outputs.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Server formatting
        working-directory: server
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; }
      - name: Server vet and unit tests (race detector on)
        working-directory: server
        run: go vet ./... && go test -race ./...
      # Fails if the entrypoint reads an option the catalog does not list, if a
      # catalogued option is read by nothing, or if the README's generated
      # tables have drifted from it.
      - name: Options catalog and generated docs are in step
        working-directory: server
        run: go run . options-docs
      - name: Container script tests
        run: sh docker/scripts.test.sh
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.versions.outputs.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web (typecheck + production build)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Web unit tests
        working-directory: web
        run: npm test

  smoke:
    name: Docker build + API smoke test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The default rtorrent
        id: rtorrent
        run: echo "version=$(sed -n 's/^ARG RTORRENT_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      # The release's amd64 cache holds main's compiled rtorrent, which a pull
      # request that leaves rtorrent alone can reuse rather than rebuild.
      - name: Build image (compiles rtorrent from source)
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: cascade:ci
          load: true
          cache-from: |
            type=gha,scope=smoke
            type=gha,scope=${{ steps.rtorrent.outputs.version }}-linux-amd64
          cache-to: type=gha,mode=max,scope=smoke
      # Includes the libtorrent patch in docker/patches: a torrent whose file
      # name is longer than Linux allows must start, under a shortened name.
      - name: Boot and exercise the API
        run: |
          docker run -d --name cascade-ci --stop-timeout 60 -p 18080:8080 -e RT_DHT=off cascade:ci
          python3 docker/api-smoke.py http://127.0.0.1:18080 cascade-ci
      - name: Container log on failure
        if: failure()
        run: docker logs cascade-ci 2>&1 | tail -50 || true
      - name: Teardown
        if: always()
        run: docker stop -t 60 cascade-ci >/dev/null 2>&1 || true

  compat:
    name: rtorrent ${{ matrix.rtorrent }}
    if: github.event_name == 'workflow_dispatch' && inputs.full-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rtorrent: ['0.9.8', '0.15.2']
    steps:
      - uses: actions/checkout@v7
      - name: The default rtorrent
        id: rtorrent
        run: echo "version=$(sed -n 's/^ARG RTORRENT_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build against rtorrent ${{ matrix.rtorrent }}
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: RTORRENT_VERSION=${{ matrix.rtorrent }}
          tags: cascade:compat
          load: true
          # The server and web stages do not depend on the rtorrent version.
          # The release's amd64 cache holds main's, and every ref can read it;
          # the smoke scope is often empty here — pushes never write it, and
          # the smoke job of this same run exports it only after this build
          # has started.
          cache-from: |
            type=gha,scope=compat-${{ matrix.rtorrent }}
            type=gha,scope=${{ steps.rtorrent.outputs.version }}-linux-amd64
            type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=compat-${{ matrix.rtorrent }}
      - name: Boot and exercise the API
        run: |
          docker run -d --name cascade-compat --stop-timeout 60 -p 18080:8080 -e RT_DHT=off cascade:compat
          python3 docker/api-smoke.py http://127.0.0.1:18080 cascade-compat
      - name: Container log on failure
        if: failure()
        run: docker logs cascade-compat 2>&1 | tail -50 || true
      - name: Teardown
        if: always()
        run: docker stop -t 60 cascade-compat >/dev/null 2>&1 || true
