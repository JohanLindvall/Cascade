# Dependabot keeps up what it can see: the server's Go modules, the web's npm
# packages and the Actions the workflows use.
#
# Both halves build from what is pinned — the server from go.mod and go.sum,
# the web from package-lock.json, transitive packages included — so a build
# never picks up an untested version by itself. A new release of a package the
# manifests name is a pull request; for the web, increase-if-necessary moves a
# range in package.json only when a release falls outside it, and within the
# range only the lockfile changes. npm version updates do not reach the web's
# transitive packages: those move when a direct update needs them to, with a
# security update, or by hand (`npm update` in web/, then commit the lockfile).
# Actions are pinned by major tag, so only a new major needs a pull request.
#
# What Dependabot cannot see: rtorrent, a git tag compiled from source, which
# .github/workflows/rtorrent-update.yml follows instead; and the base images,
# pinned through build arguments (ALPINE_VERSION, NODE_VERSION, GO_VERSION)
# rather than a literal FROM line.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      server:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      web:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
