services:
  cascade:
    # Multi-arch (amd64/arm64). Pin a release — cascade:vX.Y.Z-0.16.20 — if you
    # would rather not follow main. Comment this out and uncomment `build` to
    # compile it yourself, which is also how you pick another rtorrent version.
    image: ghcr.io/johanlindvall/cascade:latest
    # build:
    #   context: .
    #   args:
    #     # Any upstream tag; libtorrent is pinned to match.
    #     RTORRENT_VERSION: "0.16.20"
    container_name: cascade
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
      - "50000:50000/udp"
    volumes:
      - ./data/downloads:/downloads
      - ./data/config:/config
      - ./data/watch:/watch
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "UTC"

      # Bandwidth, in KiB/s (0 = unlimited)
      RT_DOWNLOAD_RATE: "0"
      RT_UPLOAD_RATE: "2048"
      RT_MAX_UPLOADS: "50"

      # Network
      RT_PORT_RANGE: "50000-50000"
      RT_DHT: "auto"
      RT_PEX: "yes"
      RT_ENCRYPTION: "allow_incoming,try_outgoing,enable_retry"

      # Web
      # WEB_USER: "admin"
      # WEB_PASS: "change-me"
